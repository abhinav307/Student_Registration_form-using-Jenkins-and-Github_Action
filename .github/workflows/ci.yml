# ════════════════════════════════════════════════════════════════
#  GitHub Actions CI — Student Registration Form (Full-Stack)
#  Runs on every push & pull request to main.
#  Validates HTML, tests API, and checks all endpoints.
# ════════════════════════════════════════════════════════════════

name: CI — Validate Student Registration Form

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build, Validate & Test
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout Code ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Verify critical files exist ──
      - name: Check project files exist
        run: |
          echo "📄 Checking project files..."
          ERRORS=0
          for f in index.html app.py requirements.txt Jenkinsfile templates/dashboard.html; do
            if [ ! -f "$f" ]; then
              echo "  ❌ Missing: $f"
              ERRORS=$((ERRORS + 1))
            else
              echo "  ✅ Found: $f"
            fi
          done
          if [ $ERRORS -gt 0 ]; then
            echo "❌ $ERRORS file(s) missing!"
            exit 1
          fi

      # ── 3. Verify required HTML elements ──
      - name: Verify required HTML elements
        run: |
          echo "🔍 Checking required HTML elements..."
          ERRORS=0

          check_element() {
            if ! grep -qi "$1" index.html; then
              echo "  ❌ Missing: $2"
              ERRORS=$((ERRORS + 1))
            else
              echo "  ✅ Found: $2"
            fi
          }

          check_element '<form'              '<form> tag'
          check_element 'id="firstName"'      'First Name field'
          check_element 'id="lastName"'        'Last Name field'
          check_element 'id="email"'           'Email field'
          check_element 'id="phone"'           'Phone field'
          check_element 'id="dob"'             'Date of Birth field'
          check_element 'name="gender"'        'Gender radio buttons'
          check_element 'id="course"'          'Course dropdown'
          check_element 'id="semester"'        'Semester dropdown'
          check_element 'type="submit"'        'Submit button'
          check_element 'id="terms"'           'Terms checkbox'
          check_element '<title>'              '<title> tag'
          check_element 'viewport'             'Viewport meta tag'
          check_element '/api/register'        'API endpoint reference'

          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "❌ $ERRORS required element(s) missing!"
            exit 1
          fi

          echo ""
          echo "🎉 All required HTML elements verified!"

      # ── 4. Set up Python ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 5. Install dependencies ──
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 6. Run HTML Tests ──
      - name: Run HTML validation tests
        run: python -m pytest tests/test_html.py -v --tb=short

      # ── 7. Run API Tests ──
      - name: Run API tests
        run: python -m pytest tests/test_api.py -v --tb=short

      # ── 8. Run All Tests with Coverage ──
      - name: Run full test suite
        run: python -m pytest tests/ -v --tb=short --junitxml=test-results.xml

      # ── 9. Summary ──
      - name: Print summary
        if: always()
        run: |
          echo "════════════════════════════════════"
          echo "  CI Pipeline Complete"
          echo "════════════════════════════════════"
          echo "  Repository: ${{ github.repository }}"
          echo "  Branch:     ${{ github.ref_name }}"
          echo "  Commit:     ${{ github.sha }}"
          echo "  Triggered:  ${{ github.event_name }}"
          echo "════════════════════════════════════"
