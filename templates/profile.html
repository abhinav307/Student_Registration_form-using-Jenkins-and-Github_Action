<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile - App</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, "Segoe UI", sans-serif; background-color: #f8fafc; color: #0f172a; min-height: 100vh; padding-top: 4.5rem; }
        .navbar { position: fixed; top: 0; left: 0; right: 0; background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; z-index: 50; }
        .nav-links a { text-decoration: none; color: #475569; margin-left: 1.5rem; font-weight: 500; }
        .nav-links .btn { background-color: #ef4444; color: #fff; padding: 0.5rem 1rem; border-radius: 6px; }
        
        .profile-container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        .profile-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        
        .cover-photo { width: 100%; height: 250px; background-color: #e2e8f0; background-size: cover; background-position: center; position: relative; }
        .avatar-container { position: absolute; bottom: -50px; left: 2rem; display: flex; align-items: flex-end; gap: 1rem; }
        .avatar { width: 120px; height: 120px; border-radius: 50%; border: 4px solid #ffffff; background-color: #cbd5e1; object-fit: cover; }
        
        .profile-info { padding: 4rem 2rem 2rem; }
        .profile-info h1 { font-size: 2rem; margin-bottom: 0.25rem; }
        .profile-info .email { color: #64748b; margin-bottom: 1.5rem; }
        
        .edit-section { border-top: 1px solid #e2e8f0; padding: 2rem; background: #f8fafc; }
        .edit-section h3 { margin-bottom: 1.5rem; color: #334155; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .field-group { display: flex; flex-direction: column; }
        .field-group.full-width { grid-column: span 2; }
        .field-group label { font-size: 0.875rem; font-weight: 500; color: #475569; margin-bottom: 0.5rem; }
        .field-group input, .field-group textarea { padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; font-family: inherit; font-size: 0.95rem; }
        .field-group input:focus, .field-group textarea:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        .btn-submit { padding: 0.75rem 1.5rem; color: #ffffff; background-color: #2563eb; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; margin-top: 1rem; transition: background 0.2s; }
        .btn-submit:hover { background-color: #1d4ed8; }
        
        @media (max-width: 640px) {
            .form-grid { grid-template-columns: 1fr; }
            .field-group.full-width { grid-column: span 1; }
            .avatar-container { left: 50%; transform: translateX(-50%); flex-direction: column; align-items: center; bottom: -80px; }
            .profile-info { padding-top: 5rem; text-align: center; }
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="logo" style="font-weight: bold; font-size: 1.2rem;">Portal</div>
    <div class="nav-links">
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        {% if current_user %}
            <a href="{{ url_for('profile') }}">Profile</a>
            <a href="{{ url_for('settings') }}">Settings</a>
            <a href="{{ url_for('logout') }}" class="btn">Logout</a>
        {% else %}
            <a href="{{ url_for('login') }}" class="btn">Login</a>
        {% endif %}
    </div>
</nav>

<div class="profile-container">
    <div class="profile-card">
        <div class="cover-photo" style="background-image: url('{{ current_user.cover_url or 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=1000&q=80' }}');">
            <div class="avatar-container">
                <img src="{{ current_user.avatar_url or 'https://ui-avatars.com/api/?name=User&background=random' }}" alt="Avatar" class="avatar">
            </div>
        </div>
        
        <div class="profile-info">
            <h1>{{ current_user.full_name or 'Anonymous User' }}</h1>
            <p class="email">{{ current_user.email }}</p>
            <p style="color: #334155; line-height: 1.6;">{{ current_user.bio or 'No bio provided yet.' }}</p>
        </div>
        
        <div class="edit-section">
            <h3>Edit Profile Details</h3>
            <form method="POST">
                <div class="form-grid">
                    <div class="field-group full-width">
                        <label for="full_name">Full Name</label>
                        <input type="text" id="full_name" name="full_name" value="{{ current_user.full_name or '' }}" required>
                    </div>
                    
                    <div class="field-group full-width">
                        <label for="bio">About Me (Bio)</label>
                        <textarea id="bio" name="bio" rows="4">{{ current_user.bio or '' }}</textarea>
                    </div>
                    
                    <div class="field-group">
                        <label for="avatar_url">Avatar Image URL</label>
                        <input type="url" id="avatar_url" name="avatar_url" value="{{ current_user.avatar_url or '' }}" placeholder="https://...">
                    </div>
                    
                    <div class="field-group">
                        <label for="cover_url">Cover Image URL</label>
                        <input type="url" id="cover_url" name="cover_url" value="{{ current_user.cover_url or '' }}" placeholder="https://...">
                    </div>
                    
                    <div class="field-group">
                        <label for="twitter">Twitter Profile</label>
                        <input type="text" id="twitter" name="twitter" value="{{ current_user.twitter or '' }}" placeholder="@username">
                    </div>
                    
                    <div class="field-group">
                        <label for="linkedin">LinkedIn URL</label>
                        <input type="url" id="linkedin" name="linkedin" value="{{ current_user.linkedin or '' }}" placeholder="https://linkedin.com/in/...">
                    </div>
                    
                    <div class="field-group full-width">
                        <label for="github">GitHub Username</label>
                        <input type="text" id="github" name="github" value="{{ current_user.github or '' }}" placeholder="username">
                    </div>
                </div>
                
                <button type="submit" class="btn-submit">Save Profile Changes</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
