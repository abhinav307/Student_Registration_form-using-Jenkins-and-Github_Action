<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header .subtitle {
            font-size: 1.1rem;
            color: #a0a0c0;
            font-weight: 400;
        }

        .header .subtitle span {
            color: #667eea;
            font-weight: 600;
        }

        /* Navigation */
        .nav-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 32px;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            background: rgba(102, 126, 234, 0.15);
            color: #667eea;
            text-decoration: none;
            border-radius: 12px;
            border: 1px solid rgba(102, 126, 234, 0.3);
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .nav-link:hover {
            background: rgba(102, 126, 234, 0.25);
            border-color: rgba(102, 126, 234, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
        }

        /* Stats Cards */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 36px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 28px 24px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.09);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .stat-card .stat-icon {
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .stat-card .stat-label {
            font-size: 0.85rem;
            color: #a0a0c0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .stat-card .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card .stat-detail {
            font-size: 0.85rem;
            color: #8080a0;
            margin-top: 6px;
        }

        /* Search Bar */
        .search-container {
            margin-bottom: 28px;
        }

        .search-input {
            width: 100%;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            color: #e0e0e0;
            font-size: 1rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input::placeholder {
            color: #6a6a8a;
        }

        .search-input:focus {
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.15), 0 0 40px rgba(102, 126, 234, 0.05);
            background: rgba(255, 255, 255, 0.08);
        }

        /* Table Card */
        .table-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 28px;
            overflow: hidden;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            text-align: left;
            padding: 14px 16px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #8080a0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            white-space: nowrap;
        }

        tbody tr {
            transition: all 0.2s ease;
        }

        tbody tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.02);
        }

        tbody tr:hover {
            background: rgba(102, 126, 234, 0.08);
        }

        tbody td {
            padding: 14px 16px;
            font-size: 0.92rem;
            color: #e0e0e0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            white-space: nowrap;
        }

        tbody td.email-col {
            color: #667eea;
        }

        /* Delete Button */
        .btn-delete {
            padding: 8px 18px;
            background: #ff4757;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .btn-delete:hover {
            background: #ff6b81;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.35);
        }

        .btn-delete:active {
            transform: translateY(0);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state .empty-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-state h3 {
            font-size: 1.4rem;
            color: #a0a0c0;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .empty-state p {
            color: #6a6a8a;
            font-size: 0.95rem;
        }

        .empty-state a {
            color: #667eea;
            text-decoration: none;
        }

        .empty-state a:hover {
            text-decoration: underline;
        }

        /* Loading Spinner */
        .loading {
            text-align: center;
            padding: 40px;
            color: #8080a0;
        }

        .loading .spinner {
            display: inline-block;
            width: 36px;
            height: 36px;
            border: 3px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(18px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            font-size: 0.92rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: rgba(46, 213, 115, 0.3);
        }

        .toast.error {
            border-color: rgba(255, 71, 87, 0.3);
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 20px 12px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .stats-row {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .table-card {
                padding: 16px;
                border-radius: 16px;
            }

            thead th,
            tbody td {
                padding: 10px 12px;
                font-size: 0.82rem;
            }

            .stat-card {
                padding: 20px 18px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.6rem;
            }

            .search-input {
                padding: 14px 18px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Student Dashboard</h1>
            <p class="subtitle">Managing <span id="totalCount">0</span> registered students</p>
        </div>

        <!-- Navigation -->
        <div class="nav-bar">
            <a href="/" class="nav-link">&#10094; Registration Form</a>
        </div>

        <!-- Stats Cards -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon">&#128218;</div>
                <div class="stat-label">Total Students</div>
                <div class="stat-value" id="statTotal">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">&#127891;</div>
                <div class="stat-label">Most Popular Course</div>
                <div class="stat-value" id="statCourse">&#8212;</div>
                <div class="stat-detail" id="statCourseDetail"></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">&#128101;</div>
                <div class="stat-label">Gender Distribution</div>
                <div class="stat-value" id="statGender">&#8212;</div>
                <div class="stat-detail" id="statGenderDetail"></div>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="&#128269; Search students by name, email, course...">
        </div>

        <!-- Students Table -->
        <div class="table-card">
            <div id="tableContent">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading students...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        let searchTimeout = null;

        // Show toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Fetch stats
        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                if (!res.ok) throw new Error('Failed to fetch stats');
                const data = await res.json();

                document.getElementById('statTotal').textContent = data.total || 0;
                document.getElementById('totalCount').textContent = data.total || 0;

                // Find most popular course
                if (data.courses && Object.keys(data.courses).length > 0) {
                    let mostPopular = '';
                    let maxCount = 0;
                    for (const [course, count] of Object.entries(data.courses)) {
                        if (count > maxCount) {
                            maxCount = count;
                            mostPopular = course;
                        }
                    }
                    document.getElementById('statCourse').textContent = mostPopular;
                    document.getElementById('statCourseDetail').textContent = maxCount + ' students enrolled';
                } else {
                    document.getElementById('statCourse').textContent = '\u2014';
                    document.getElementById('statCourseDetail').textContent = '';
                }

                if (data.genders && Object.keys(data.genders).length > 0) {
                    const gd = data.genders;
                    const parts = [];
                    if (gd.Male) parts.push('M: ' + gd.Male);
                    if (gd.Female) parts.push('F: ' + gd.Female);
                    if (gd.Other) parts.push('O: ' + gd.Other);
                    document.getElementById('statGender').textContent = parts.join(' / ') || '\u2014';

                    const total = data.total || 1; // avoid division by zero
                    const pcts = [];
                    if (gd.Male) pcts.push(Math.round((gd.Male / total) * 100) + '% Male');
                    if (gd.Female) pcts.push(Math.round((gd.Female / total) * 100) + '% Female');
                    if (gd.Other) pcts.push(Math.round((gd.Other / total) * 100) + '% Other');
                    document.getElementById('statGenderDetail').textContent = pcts.join(', ');
                } else {
                    document.getElementById('statGender').textContent = '\u2014';
                    document.getElementById('statGenderDetail').textContent = '';
                }
            } catch (err) {
                console.error('Stats error:', err);
            }
        }

        // Fetch and render students
        async function fetchStudents(query = '') {
            try {
                let url = '/api/students';
                if (query) url += '?search=' + encodeURIComponent(query);

                const res = await fetch(url);
                if (!res.ok) throw new Error('Failed to fetch students');
                const data = await res.json();

                renderTable(data.students);
            } catch (err) {
                console.error('Fetch error:', err);
                document.getElementById('tableContent').innerHTML =
                    '<div class="empty-state">' +
                    '<div class="empty-icon">&#9888;&#65039;</div>' +
                    '<h3>Something went wrong</h3>' +
                    '<p>Could not load student data. Please try again later.</p>' +
                    '</div>';
            }
        }

        // Render the table
        function renderTable(students) {
            const container = document.getElementById('tableContent');

            if (!students || students.length === 0) {
                container.innerHTML =
                    '<div class="empty-state">' +
                    '<div class="empty-icon">&#128218;</div>' +
                    '<h3>No students registered yet</h3>' +
                    '<p>Head over to the <a href="/">Registration Form</a> to add your first student.</p>' +
                    '</div>';
                return;
            }

            let html = '<div class="table-wrapper"><table>' +
                '<thead><tr>' +
                '<th>#</th>' +
                '<th>Name</th>' +
                '<th>Email</th>' +
                '<th>Phone</th>' +
                '<th>Course</th>' +
                '<th>Semester</th>' +
                '<th>Gender</th>' +
                '<th>Registered</th>' +
                '<th>Actions</th>' +
                '</tr></thead><tbody>';

            students.forEach(function(student, index) {
                const regDate = student.registered_at
                    ? new Date(student.registered_at).toLocaleDateString('en-US', {
                        year: 'numeric', month: 'short', day: 'numeric'
                    })
                    : '\u2014';

                const fullName = (student.first_name || '') + ' ' + (student.last_name || '');

                html += '<tr>' +
                    '<td>' + (index + 1) + '</td>' +
                    '<td>' + escapeHtml(fullName.trim() || '') + '</td>' +
                    '<td class="email-col">' + escapeHtml(student.email || '') + '</td>' +
                    '<td>' + escapeHtml(student.phone || '') + '</td>' +
                    '<td>' + escapeHtml(student.course || '') + '</td>' +
                    '<td>' + escapeHtml(String(student.semester || '')) + '</td>' +
                    '<td>' + escapeHtml(student.gender || '') + '</td>' +
                    '<td>' + regDate + '</td>' +
                    '<td><button class="btn-delete" onclick="deleteStudent(' + student.id + ')">Delete</button></td>' +
                    '</tr>';
            });

            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(text));
            return div.innerHTML;
        }

        // Delete a student
        async function deleteStudent(id) {
            if (!confirm('Are you sure you want to delete this student?')) return;

            try {
                const res = await fetch('/api/students/' + id, { method: 'DELETE' });
                if (!res.ok) throw new Error('Delete failed');

                showToast('Student deleted successfully', 'success');
                fetchStudents(document.getElementById('searchInput').value.trim());
                fetchStats();
            } catch (err) {
                console.error('Delete error:', err);
                showToast('Failed to delete student', 'error');
            }
        }

        // Search with debounce
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            const query = this.value.trim();
            searchTimeout = setTimeout(function() {
                fetchStudents(query);
            }, 300);
        });

        // Initial load
        fetchStats();
        fetchStudents();
    </script>
</body>
</html>
