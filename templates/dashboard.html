<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <style>
        /* ── Reset & Base ── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            padding: 2.5rem 1.5rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ── Header ── */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.25rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        .header .subtitle {
            font-size: 1.05rem;
            color: #64748b;
        }

        .header .subtitle span {
            color: #2563eb;
            font-weight: 600;
        }

        /* ── Navigation ── */
        .nav-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 2.5rem;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #2563eb;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 0.6rem 1.25rem;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .nav-link:hover {
            background-color: #dbeafe;
            border-color: #93c5fd;
        }

        /* ── Stats Cards ── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.2s;
        }

        .stat-card:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        .stat-card .stat-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .stat-card .stat-icon {
            font-size: 1.5rem;
            background: #eff6ff;
            padding: 0.5rem;
            border-radius: 8px;
        }

        .stat-card .stat-label {
            font-size: 0.875rem;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.25rem;
        }

        .stat-card .stat-detail {
            font-size: 0.875rem;
            color: #64748b;
        }

        /* ── Search Bar ── */
        .search-container {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 2.5rem;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            color: #0f172a;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        .search-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        
        .search-icon-placeholder {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            pointer-events: none;
        }

        /* ── Table Card ── */
        .table-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        thead th {
            padding: 0.875rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid #e2e8f0;
            transition: background-color 0.15s;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: #f1f5f9;
        }

        tbody td {
            padding: 1rem;
            font-size: 0.9rem;
            color: #334155;
            white-space: nowrap;
        }

        tbody td.email-col {
            color: #2563eb;
            font-weight: 500;
        }

        /* ── Delete Button ── */
        .btn-delete {
            padding: 0.4rem 0.75rem;
            background: #ffffff;
            color: #ef4444;
            border: 1px solid #fca5a5;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-delete:hover {
            background: #fef2f2;
            border-color: #ef4444;
        }

        /* ── Empty State ── */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.125rem;
            color: #0f172a;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .empty-state p {
            color: #64748b;
            font-size: 0.95rem;
        }

        .empty-state a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }

        .empty-state a:hover {
            text-decoration: underline;
        }

        /* ── Loading Spinner ── */
        .loading {
            text-align: center;
            padding: 3rem;
            color: #64748b;
        }

        .loading .spinner {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            border: 2px solid #e2e8f0;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 0.75rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Toast Notification ── */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #ffffff;
            color: #0f172a;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            transform: translateY(150%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .toast.show {
            transform: translateY(0);
        }
        
        .toast.success {
            border-left: 4px solid #22c55e;
        }

        .toast.error {
            border-left: 4px solid #ef4444;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            body {
                padding: 1.5rem 1rem;
            }

            .header h1 {
                font-size: 1.75rem;
            }

            .stats-row {
                grid-template-columns: 1fr;
            }

            .stat-card {
                padding: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Student Dashboard</h1>
            <p class="subtitle">Managing <span id="totalCount">0</span> registered students</p>
        </div>

        <!-- Navigation -->
        <div class="nav-bar">
            <a href="/" class="nav-link">&#10094; Registration Form</a>
        </div>

        <!-- Stats Cards -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon">&#128218;</div>
                    <div class="stat-label">Total Students</div>
                </div>
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-detail">Registered currently</div>
            </div>
            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon">&#127891;</div>
                    <div class="stat-label">Most Popular Course</div>
                </div>
                <div class="stat-value" id="statCourse">&#8212;</div>
                <div class="stat-detail" id="statCourseDetail"></div>
            </div>
            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon">&#128101;</div>
                    <div class="stat-label">Gender Distribution</div>
                </div>
                <div class="stat-value" style="font-size: 1.2rem; margin-top: 0.5rem;" id="statGender">&#8212;</div>
                <div class="stat-detail" style="margin-top: 0.5rem;" id="statGenderDetail"></div>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <span class="search-icon-placeholder">&#128269;</span>
            <input type="text" class="search-input" id="searchInput" placeholder="Search students by name, email, course...">
        </div>

        <!-- Students Table -->
        <div class="table-card">
            <div id="tableContent">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading students...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        let searchTimeout = null;

        // Show toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Fetch stats
        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                if (!res.ok) throw new Error('Failed to fetch stats');
                const data = await res.json();

                document.getElementById('statTotal').textContent = data.total || 0;
                document.getElementById('totalCount').textContent = data.total || 0;

                // Find most popular course
                if (data.courses && Object.keys(data.courses).length > 0) {
                    let mostPopular = '';
                    let maxCount = 0;
                    for (const [course, count] of Object.entries(data.courses)) {
                        if (count > maxCount) {
                            maxCount = count;
                            mostPopular = course;
                        }
                    }
                    document.getElementById('statCourse').textContent = mostPopular;
                    document.getElementById('statCourseDetail').textContent = maxCount + ' students enrolled';
                } else {
                    document.getElementById('statCourse').textContent = '\u2014';
                    document.getElementById('statCourseDetail').textContent = '';
                }

                if (data.genders && Object.keys(data.genders).length > 0) {
                    const gd = data.genders;
                    const parts = [];
                    if (gd.Male) parts.push('M: ' + gd.Male);
                    if (gd.Female) parts.push('F: ' + gd.Female);
                    if (gd.Other) parts.push('O: ' + gd.Other);
                    document.getElementById('statGender').textContent = parts.join(' / ') || '\u2014';

                    const total = data.total || 1; // avoid division by zero
                    const pcts = [];
                    if (gd.Male) pcts.push(Math.round((gd.Male / total) * 100) + '% Male');
                    if (gd.Female) pcts.push(Math.round((gd.Female / total) * 100) + '% Female');
                    if (gd.Other) pcts.push(Math.round((gd.Other / total) * 100) + '% Other');
                    document.getElementById('statGenderDetail').textContent = pcts.join(', ');
                } else {
                    document.getElementById('statGender').textContent = '\u2014';
                    document.getElementById('statGenderDetail').textContent = '';
                }
            } catch (err) {
                console.error('Stats error:', err);
            }
        }

        // Fetch and render students
        async function fetchStudents(query = '') {
            try {
                let url = '/api/students';
                if (query) url += '?search=' + encodeURIComponent(query);

                const res = await fetch(url);
                if (!res.ok) throw new Error('Failed to fetch students');
                const data = await res.json();

                renderTable(data.students);
            } catch (err) {
                console.error('Fetch error:', err);
                document.getElementById('tableContent').innerHTML =
                    '<div class="empty-state">' +
                    '<div class="empty-icon">&#9888;&#65039;</div>' +
                    '<h3>Something went wrong</h3>' +
                    '<p>Could not load student data. Please try again later.</p>' +
                    '</div>';
            }
        }

        // Render the table
        function renderTable(students) {
            const container = document.getElementById('tableContent');

            if (!students || students.length === 0) {
                container.innerHTML =
                    '<div class="empty-state">' +
                    '<div class="empty-icon">&#128218;</div>' +
                    '<h3>No students registered yet</h3>' +
                    '<p>Head over to the <a href="/">Registration Form</a> to add your first student.</p>' +
                    '</div>';
                return;
            }

            let html = '<div class="table-wrapper"><table>' +
                '<thead><tr>' +
                '<th>#</th>' +
                '<th>Name</th>' +
                '<th>Email</th>' +
                '<th>Phone</th>' +
                '<th>Course</th>' +
                '<th>Semester</th>' +
                '<th>Gender</th>' +
                '<th>Registered</th>' +
                '<th>Actions</th>' +
                '</tr></thead><tbody>';

            students.forEach(function(student, index) {
                const regDate = student.registered_at
                    ? new Date(student.registered_at).toLocaleDateString('en-US', {
                        year: 'numeric', month: 'short', day: 'numeric'
                    })
                    : '\u2014';

                const fullName = (student.first_name || '') + ' ' + (student.last_name || '');

                html += '<tr>' +
                    '<td>' + (index + 1) + '</td>' +
                    '<td>' + escapeHtml(fullName.trim() || '') + '</td>' +
                    '<td class="email-col">' + escapeHtml(student.email || '') + '</td>' +
                    '<td>' + escapeHtml(student.phone || '') + '</td>' +
                    '<td>' + escapeHtml(student.course || '') + '</td>' +
                    '<td>' + escapeHtml(String(student.semester || '')) + '</td>' +
                    '<td>' + escapeHtml(student.gender || '') + '</td>' +
                    '<td>' + regDate + '</td>' +
                    '<td><button class="btn-delete" onclick="deleteStudent(' + student.id + ')">Delete</button></td>' +
                    '</tr>';
            });

            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(text));
            return div.innerHTML;
        }

        // Delete a student
        async function deleteStudent(id) {
            if (!confirm('Are you sure you want to delete this student?')) return;

            try {
                const res = await fetch('/api/students/' + id, { method: 'DELETE' });
                if (!res.ok) throw new Error('Delete failed');

                showToast('Student deleted successfully', 'success');
                fetchStudents(document.getElementById('searchInput').value.trim());
                fetchStats();
            } catch (err) {
                console.error('Delete error:', err);
                showToast('Failed to delete student', 'error');
            }
        }

        // Search with debounce
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            const query = this.value.trim();
            searchTimeout = setTimeout(function() {
                fetchStudents(query);
            }, 300);
        });

        // Initial load
        fetchStats();
        fetchStudents();
    </script>
</body>
</html>
